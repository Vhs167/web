<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        
        <title>Лабораторная работа 1</title>

        <link rel="stylesheet" href="style.css">
        
    </head>

    <body>
        <header>
            <h1>Проверка попадания точки в область</h1>

            <p>ФИО: Ягодинский Михаил Александрович</p>
            <p>Группа: P3209</p>
            <p>Вариант: 12653</p>
        </header>

        <main class="main">
            <div class="top-section">
                <section class="graph-section">
                    <h2>Координатная плоскость</h2>

                    <canvas id="coordinateCanvas"
                            width="400"
                            height="400">

                    </canvas>
                </section>

                <section class="form-section">
                    <h2>Ввод данных:</h2>

                    <form id="pointForm">

                        <div class="form-group">
                            <label for="x">X:</label>
                            <input type="text"
                                    id="x"
                                    name="x"
                                    placeholder="Введите значение">

                        </div>
                        

                        <div class="form-group">
                            <p>Y:</p>
                            
                            <label>
                                <input type="radio" name="y" value="-2">
                                -2
                            </label>
                            <label>
                                <input type="radio" name="y" value="-1.5">
                                -1.5
                            </label>
                            <label>
                                <input type="radio" name="y" value="-1">
                                -1
                            </label>
                            <label>
                                <input type="radio" name="y" value="-0.5">
                                -0.5
                            </label>
                            <label>
                                <input type="radio" name="y" value="0">
                                0
                            </label>
                            <label>
                                <input type="radio" name="y" value="0.5">
                                0.5
                            </label>
                            <label>
                                <input type="radio" name="y" value="1">
                                1
                            </label>
                            <label>
                                <input type="radio" name="y" value="1.5">
                                1.5
                            </label>
                            <label>
                                <input type="radio" name="y" value="2">
                                2
                            </label>
                        </div>
                    

                        <div class="form-group">
                            <label for="r">R:</label>

                            <select id="r" name="r">
                                <option value="1">1</option>
                                <option value="1.5">1.5</option>
                                <option value="2">2</option>
                                <option value="2.5">2.5</option>
                                <option value="3">3</option>
                            </select>
                        </div>

                        <div id="errorMessage"></div>

                        <button type="submit">Проверить</button>
                    </form>
                </section>
            </div>

            <section class="results-section">
                <h2>Результаты</h2>

                <table id="resultsTable">

                    <thead>
                        <tr>
                            <th>X</th>
                            <th>Y</th>
                            <th>R</th>
                            <th>Результат</th>
                            <th>Дата и время</th>
                        </tr>
                    </thead>

                    <tbody id="resultBody">

                    </tbody>
                </table>

            </section>
        </main>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/decimal.js/10.4.3/decimal.js"></script>
        <script src="script.js"></script>
    </body>
</html>
